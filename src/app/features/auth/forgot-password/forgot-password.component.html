<div class="fp-card">
  <h1 class="dl-display">Recuperar senha</h1>
  <p class="dl-text-muted">Informe seu e-mail para receber as instruções de redefinição.</p>

  @if (!enviado()) {
    <form [formGroup]="form" (ngSubmit)="submit()" class="fp-form">
      <label class="fp-form__field">
        <span>E-mail</span>
        <input type="email" formControlName="email" placeholder="seu@email.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="fp-form__error">Informe um e-mail válido.</small>
        }
      </label>

      <button type="submit" class="fp-form__submit" [disabled]="loading()">
        {{ loading() ? 'Enviando...' : 'Enviar instruções' }}
      </button>
    </form>
  } @else {
    <div class="fp-success">
      <span class="material-icons">mark_email_read</span>
      <p>Enviamos as instruções de redefinição para o seu e-mail.</p>
    </div>
  }

  <p class="fp-card__footer"><a routerLink="/login">← Voltar para o login</a></p>
</div>
